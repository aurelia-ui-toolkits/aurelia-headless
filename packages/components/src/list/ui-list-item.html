<template class="ui-list-item"
  role="option"
  aria-selected.attr="selected ? 'true' : 'false'"
  aria-disabled.attr="disabled ? '' : null"
  data-active.attr="parentList.activeListItem === slotHost ? '' : null"
  data-selected.attr="selected ? '' : null"
  data-disabled.attr="disabled ? '' : null"
  data-secondary.attr="hasSecondary ? '' : null"
  data-reverse.attr="reverse ? '' : null">
  <span class="ui-list-item__leading" show.bind="leadingNodes.length">
    <au-slot name="leading" expose.bind="slotHost"></au-slot>
  </span>
  <span class="ui-list-item__content">
    <span class="ui-list-item__primary">
      <au-slot expose.bind="slotHost"></au-slot>
    </span>
    <span class="ui-list-item__secondary" show.bind="hasSecondary">
      <au-slot name="secondary" expose.bind="slotHost"></au-slot>
    </span>
  </span>
  <span class="ui-list-item__trailing" show.bind="trailingNodes.length">
    <au-slot name="trailing" expose.bind="slotHost"></au-slot>
  </span>
</template>
