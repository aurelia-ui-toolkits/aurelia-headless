<template class="ui-prompt-modal">
  <h2 class="ui-prompt-modal__title" if.bind="data.title">${data.title}</h2>
  <ui-input label.bind="data.label" textarea.bind="data.textarea" value.bind="data.text" required.bind="data.required"
    invalid.bind="invalid" autofocus></ui-input>
  <div class="ui-prompt-modal__error" if.bind="invalid">This field is required.</div>
  <div class="ui-prompt-modal__actions">
    <button ui-button outlined type="button" if.bind="data.cancelText"
      click.trigger="cancel()">${data.cancelText}</button>
    <button ui-button primary type="button" if.bind="data.okText" click.trigger="ok()">${data.okText}</button>
  </div>
</template>
