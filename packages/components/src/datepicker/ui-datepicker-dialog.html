<template class="ui-datepicker-dialog" data-time.attr="data.time ? '' : null">
  <div class="ui-datepicker-dialog__header">
    <span class="ui-datepicker-dialog__label">${data.label}</span>
    <h2 class="ui-datepicker-dialog__title">${title}</h2>
  </div>

  <div class="ui-datepicker-dialog__body">
    <div class="ui-datepicker-dialog__nav">
      <select class="ui-datepicker-dialog__month" value.bind="visibleMonth" change.trigger="monthChanged()">
        <option repeat.for="month of months" value.bind="month.value" disabled.bind="month.disabled">${month.label}</option>
      </select>
      <select class="ui-datepicker-dialog__year" value.bind="visibleYear" change.trigger="yearChanged()">
        <option repeat.for="year of years" value.bind="year">${year}</option>
      </select>
      <button class="ui-datepicker-dialog__nav-button" ui-icon-button type="button" click.trigger="prev()" aria-label="Previous month">‹</button>
      <button class="ui-datepicker-dialog__nav-button" ui-icon-button type="button" click.trigger="next()" aria-label="Next month">›</button>
    </div>

    <div class="ui-datepicker-dialog__calendar">
      <span class="ui-datepicker-dialog__weekday" repeat.for="weekday of weekdays">${weekday}</span>
      <button class="ui-datepicker-dialog__day"
        repeat.for="day of days"
        type="button"
        disabled.bind="day.disabled"
        data-outside.attr="day.outside ? '' : null"
        data-selected.attr="day.selected ? '' : null"
        data-today.attr="day.today ? '' : null"
        click.trigger="selectDay(day)">${day.date ? day.label : ''}</button>
    </div>

    <div class="ui-datepicker-dialog__time" if.bind="data.time">
      <label class="ui-datepicker-dialog__time-field">
        <span>Hour</span>
        <input type="number" min="0" max="23" value.bind="hour" change.trigger="timeChanged()">
      </label>
      <label class="ui-datepicker-dialog__time-field">
        <span>Minute</span>
        <input type="number" min="0" max="59" step.bind="minuteStep" value.bind="minute" change.trigger="timeChanged()">
      </label>
    </div>
  </div>

  <div class="ui-datepicker-dialog__actions">
    <button ui-button outlined type="button" click.trigger="cancel()">${cancelText}</button>
    <button ui-button primary type="button" click.trigger="ok()" autofocus>${okText}</button>
  </div>
</template>
