<template class="ui-checkbox"
  data-field.attr="hasField ? '' : null"
  data-disabled.attr="disabled ? '' : null"
  data-inset.attr="inset ? '' : null"
  data-invalid.attr="invalid || errors.size ? '' : null">
  <div class="ui-checkbox__control">
    <span class="ui-checkbox__box"
      role="checkbox"
      tabindex.bind="disabled ? null : tabIndex"
      aria-checked.attr="indeterminate ? 'mixed' : checked ? 'true' : 'false'"
      aria-disabled.attr="disabled ? '' : null"
      aria-labelledby.bind="hasLabel ? labelId : null"
      aria-describedby.bind="errors.size ? errorsId : (helperText || helperNodes.length ? helperId : null)"
      data-checked.attr="checked ? '' : null"
      data-disabled.attr="disabled ? '' : null"
      data-indeterminate.attr="indeterminate ? '' : null"
      data-hover.attr="hover ? '' : null"
      data-focus.attr="focus ? '' : null"
      data-active.attr="active ? '' : null"
      data-changing.attr="changing ? '' : null"
      click.trigger="onClick($event)"
      keyup.trigger="onKeyUp($event)"
      keypress.trigger="onKeyPress($event)"
      mouseenter.trigger="onMouseEnter()"
      mouseleave.trigger="onMouseLeave()"
      focusin.trigger="onFocusIn()"
      focusout.trigger="onFocusOut()"
      pointerdown.trigger="onPointerDown()"
      pointerup.trigger="onPointerUp()"
      pointerleave.trigger="onPointerLeave()">
      <input ref="controlEl"
        class="ui-checkbox__native"
        type="checkbox"
        id.attr="id || null"
        checked.bind="checked"
        disabled.bind="disabled"
        click.trigger="onInputClick($event)"
        change.trigger="onInputChange($event)">
      <span class="ui-checkbox__indicator" aria-hidden="true"></span>
    </span>

    <label class="ui-checkbox__label"
      for.bind="id"
      id.bind="hasLabel ? labelId : null"
      show.bind="hasLabel"><au-slot>${label}</au-slot></label>
  </div>

  <div class="ui-checkbox__subscript" show.bind="hasSubscript">
    <div class="ui-checkbox__helper" id.bind="helperId" show.bind="!errors.size && (helperText || helperNodes.length)">
      <au-slot name="helper">${helperText}</au-slot>
    </div>

    <div class="ui-checkbox__errors" id.bind="errorsId" show.bind="errors.size">
      <div class="ui-checkbox__error" repeat.for="[error, _] of errors" if.bind="error.message">${error.message}</div>
    </div>
  </div>
</template>
