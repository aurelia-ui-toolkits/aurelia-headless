<demo-section title="ui-disclosure">

  <demo-block title="Basic">
    <ui-disclosure>
      <template au-slot="header">
        What is Aurelia Headless?
      </template>
      <template au-slot="content">
        A set of unstyled, accessible interaction primitives for Aurelia, inspired by Headless UI.
      </template>
    </ui-disclosure>
  </demo-block>

  <demo-block title="Default open">
    <ui-disclosure open>
      <template au-slot="header">
        Shipping details
      </template>
      <template au-slot="content">
        Free shipping for orders over $50. Delivery takes 3-5 business days.
      </template>
    </ui-disclosure>
  </demo-block>

  <demo-block title="Controlled (two-way open)">
    <button ui-button outlined click.trigger="controlledOpen = !controlledOpen">Toggle from outside</button>
    <span class="disclosure-state">open = ${controlledOpen}</span>
    <ui-disclosure open.bind="controlledOpen">
      <template au-slot="header">
        Payment methods
      </template>
      <template au-slot="content">
        We accept all major cards and PayPal.
      </template>
    </ui-disclosure>
  </demo-block>
</demo-section>
