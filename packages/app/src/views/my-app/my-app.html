<ui-top-app-bar sticky class="app-top-bar">
  <button au-slot="navigation" class="app-menu-button" ui-icon-button click.trigger="menuOpen = !menuOpen" aria-label="Toggle menu">
    <svg class="menu-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
  </button>
  <ui-breadcrumbs au-slot="breadcrumbs" items.bind="breadcrumbs"></ui-breadcrumbs>
  <a au-slot="actions" ui-button outlined href="https://github.com/aurelia-ui-toolkits/aurelia-headless" target="_blank" rel="noreferrer">GitHub</a>
</ui-top-app-bar>

<div class="app-layout" data-menu-open.attr="menuOpen ? '' : null">
  <ui-drawer class="app-drawer" persistent open.bind="menuOpen" side="left" modal="false" label="Component navigation">
    <a class="brand" href="/" aria-label="Aurelia Headless UI home">
      <img class="brand-logo" src.bind="logoUrl" alt="Aurelia Headless UI logo" />
      <span class="brand-copy">
        <span class="brand-name">Aurelia Headless UI</span>
        <span class="brand-tagline">Components with no head. Mostly.</span>
      </span>
    </a>
    <nav class="side-menu" aria-label="Components">
      <ui-list class="side-menu-list"
        items.bind="menuItems"
        selected.to-view="selectedMenuItem"
        typeahead-field="title"
        list-select.trigger="navigate($event.detail.path)">
        <ui-list-item repeat.for="item of menuItems" value.bind="item">
          ${item.title}
        </ui-list-item>
      </ui-list>
    </nav>
  </ui-drawer>

  <main class="content-panel">
    <div class="route-panel">
      <au-viewport></au-viewport>
    </div>
  </main>
</div>
