<div class="app-shell">
  <ui-top-app-bar class="app-top-bar">
    <button au-slot="navigation" class="app-menu-button" ui-icon-button ref="menuButton" click.trigger="menuOpen = !menuOpen"
      aria-label="Toggle menu">
      <svg class="menu-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 4h10M3 8h10M3 12h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        </path>
      </svg>
    </button>
    <ui-breadcrumbs au-slot="breadcrumbs" items.bind="breadcrumbs"></ui-breadcrumbs>
    <label au-slot="actions" class="theme-toggle">
      <span class="theme-toggle__label">Compact</span>
      <ui-switch checked.two-way="compactTheme" aria-label="Toggle compact theme"></ui-switch>
    </label>
    <label au-slot="actions" class="theme-toggle">
      <span class="theme-toggle__label">Dark</span>
      <ui-switch checked.two-way="darkTheme" aria-label="Toggle dark theme"></ui-switch>
    </label>
    <a au-slot="actions" ui-icon-button size="large" href="https://github.com/aurelia-ui-toolkits/aurelia-headless"
      target="_blank" rel="noreferrer" aria-label="GitHub repository">
      <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor"
          d="M12 2C6.48 2 2 6.58 2 12.24c0 4.51 2.87 8.34 6.84 9.69.5.09.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.33 9.33 0 0 1 12 6.93c.85 0 1.71.12 2.51.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.8 0 .27.18.59.69.49A10.07 10.07 0 0 0 22 12.24C22 6.58 17.52 2 12 2Z">
        </path>
      </svg>
    </a>
  </ui-top-app-bar>

  <div class="app-layout" data-menu-open.attr="menuOpen && !mobile ? '' : null">
    <ui-drawer class="app-drawer" persistent.bind="!mobile" open.two-way="menuOpen" side="left" modal.bind="mobile" trigger.bind="menuButton"
      label="Component navigation">
      <a class="brand" href="/" aria-label="Aurelia Headless UI home">
        <img class="brand-logo" src.bind="logoUrl" alt="Aurelia Headless UI logo" />
        <span class="brand-copy">
          <span class="brand-name">Aurelia Headless UI</span>
          <span class="brand-tagline">Components with no head. Mostly.</span>
        </span>
      </a>
      <nav class="side-menu" aria-label="Components">
        <ui-list class="side-menu-list" items.bind="menuItems" selected.to-view="selectedMenuItem"
          typeahead-field="title" list-select.trigger="navigate($event.detail.path)">
          <ui-list-item repeat.for="item of menuItems" value.bind="item">
            ${item.title}
          </ui-list-item>
        </ui-list>
      </nav>
    </ui-drawer>

    <main class="content-panel">
      <div class="route-panel">
        <au-viewport></au-viewport>
      </div>
    </main>
  </div>
</div>
