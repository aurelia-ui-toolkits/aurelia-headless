<demo-section title="ui-select">
  <demo-block title="Custom slotted list">
    <ui-select value.bind="selectedProjectId & validate"
      selected-item.bind="selectedProject"
      value-field="id"
      label-field="name"
      label="Project"
      helper-text="Choose project for deployment."
      placeholder="Select project">
      <ui-list items.bind="projects" selected.bind="selectedProject" typeahead-field="name">
        <ui-list-item repeat.for="project of projects" value.bind="project" disabled.bind="project.disabled">
          ${project.name}
          <span au-slot="secondary">${project.region}</span>
        </ui-list-item>
      </ui-list>
    </ui-select>
    <span class="select-state">Value: ${selectedProjectId || 'none'}</span>
  </demo-block>

  <demo-block title="Inset label with custom item layout">
    <ui-select value.bind="selectedTeamId"
      selected-item.bind="selectedTeam"
      value-field="id"
      label-field="name"
      inset
      label="Team"
      helper-text="Disabled items remain unavailable."
      placeholder="Select team">
      <span au-slot="leading">#</span>
      <ui-list items.bind="projects" selected.bind="selectedTeam" typeahead-field="name">
        <ui-list-item repeat.for="project of projects" value.bind="project" disabled.bind="project.disabled">
          ${project.name}
          <span au-slot="secondary">${project.region}</span>
          <span au-slot="trailing">${project.id}</span>
        </ui-list-item>
      </ui-list>
    </ui-select>
  </demo-block>
</demo-section>
