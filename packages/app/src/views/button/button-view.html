<demo-section title="ui-button">

  <demo-block title="Basic">
    <button ui-button primary click.trigger="handleClick()">
      Click me
    </button>
    <span class="status-text">Clicked: ${clickCount} times</span>
  </demo-block>

  <demo-block title="Disabled">
    <button ui-button primary disabled>
      I'm disabled
    </button>
  </demo-block>

  <demo-block title="Toggle disabled">
    <button ui-button primary disabled.bind="isLoading" click.trigger="handleClick()">
      ${isLoading ? 'Loading...' : 'Submit'}
    </button>
    <button ui-button click.trigger="toggleLoading()" class="btn-toggle">
      Toggle loading: ${isLoading}
    </button>
  </demo-block>

  <demo-block title="Outlined variant">
    <button ui-button outlined click.trigger="handleClick()">
      Outlined
    </button>
  </demo-block>

  <demo-block title="Icon button">
    <div class="button-demo-row">
      <button ui-icon-button aria-label="Add item" click.trigger="handleClick()">
        <svg class="button-demo-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <button ui-icon-button outlined aria-label="More options">
        <svg class="button-demo-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8h.01M8 8h.01M12.5 8h.01" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
        </svg>
      </button>
      <button ui-icon-button aria-label="Close">
        <svg class="button-demo-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <button ui-icon-button disabled aria-label="Disabled action">
        <svg class="button-demo-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </demo-block>
</demo-section>
