<demo-section title="ui-checkbox">

  <demo-block title="Basic">
    <ui-checkbox checked.bind="marketingConsent" label="Marketing emails"></ui-checkbox>
    <span class="text-sm text-ink-500">${marketingConsent ? 'Subscribed' : 'Unsubscribed'}</span>
  </demo-block>

  <demo-block title="Disabled">
    <ui-checkbox checked disabled label="Security updates"></ui-checkbox>
  </demo-block>

  <demo-block title="Indeterminate">
    <ui-checkbox indeterminate label="Partially selected group"></ui-checkbox>
  </demo-block>

  <demo-block title="Two-way binding">
    <ui-checkbox checked.bind="termsAccepted" label="Accept terms"></ui-checkbox>
    <span class="text-sm text-ink-500">${termsAccepted ? 'Accepted' : 'Required'}</span>
  </demo-block>

  <demo-block title="Helper text">
    <ui-checkbox checked.bind="reportsEnabled" label="Weekly reports" helper-text="Send a summary every Monday."></ui-checkbox>
  </demo-block>

  <demo-block title="Slotted helper">
    <ui-checkbox checked.bind="advancedAlerts" label="Advanced alerts">
      <span au-slot="helper">Includes warning and recovery notifications.</span>
    </ui-checkbox>
  </demo-block>
</demo-section>
