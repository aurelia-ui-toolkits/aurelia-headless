<demo-section title="ui-popup">

  <demo-block title="Default target (document body)">
    <button ui-button primary ref="basicAnchor" click.trigger="basicOpen = !basicOpen">
      ${basicOpen ? 'Hide actions' : 'Show actions'}
    </button>

    <ui-popup open.bind="basicOpen" anchor.bind="basicAnchor" match-anchor-width>
      <div class="popup-demo-card">
        <strong>Quick actions</strong>
        <span>Use this primitive for menu and lookup overlays.</span>
        <button ui-button outlined click.trigger="basicOpen = false">Close</button>
      </div>
    </ui-popup>
  </demo-block>

  <demo-block title="Custom portal target">
    <div class="popup-demo-target" ref="inlineTarget"></div>

    <button ui-button primary ref="inlineAnchor" click.trigger="inlineOpen = !inlineOpen">
      ${inlineOpen ? 'Hide inline popup' : 'Show inline popup'}
    </button>

    <ui-popup open.bind="inlineOpen"
      anchor.bind="inlineAnchor"
      portal-target.bind="inlineTarget"
      placement="top-end"
      offset="10">
      <div class="popup-demo-card">
        <strong>Inline target</strong>
        <span>This popup is portalled into the dashed container above.</span>
      </div>
    </ui-popup>
  </demo-block>

  <demo-block title="Popup with a form (multiple focus stops)">
    <button ui-button primary ref="formAnchor" click.trigger="formOpen = !formOpen">
      ${formOpen ? 'Hide form' : 'Edit label'}
    </button>
    <button ui-button outlined>Next control (tab-away target)</button>

    <ui-popup open.bind="formOpen" anchor.bind="formAnchor">
      <div class="popup-demo-card">
        <strong>Edit label</strong>
        <ui-input value.bind="formName" label="Name"></ui-input>
        <ui-input value.bind="formEmail" label="Email"></ui-input>
        <div class="popup-demo-actions">
          <button ui-button outlined click.trigger="formOpen = false">Cancel</button>
          <button ui-button primary click.trigger="formOpen = false">Save</button>
        </div>
      </div>
    </ui-popup>
  </demo-block>
</demo-section>
