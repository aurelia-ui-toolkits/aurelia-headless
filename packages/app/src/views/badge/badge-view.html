<demo-section title="ui-badge">
  <demo-block title="Tones">
    <div class="badge-demo-row">
      <ui-badge>Neutral</ui-badge>
      <ui-badge tone="primary">Primary</ui-badge>
      <ui-badge tone="success">Success</ui-badge>
      <ui-badge tone="warning">Warning</ui-badge>
      <ui-badge tone="danger">Danger</ui-badge>
    </div>
  </demo-block>

  <demo-block title="Pill and outlined">
    <div class="badge-demo-row">
      <ui-badge pill>12</ui-badge>
      <ui-badge tone="primary" pill>New</ui-badge>
      <ui-badge tone="success" outlined>Active</ui-badge>
      <ui-badge tone="warning" outlined pill>Pending</ui-badge>
      <ui-badge tone="danger" outlined>Blocked</ui-badge>
    </div>
  </demo-block>

  <demo-block title="Composed with content">
    <div class="badge-demo-card">
      <div>
        <h3>Project Aurora</h3>
        <p>Badges work inside app-owned markup.</p>
      </div>
      <div class="badge-demo-row">
        <ui-badge tone="success" pill>Open</ui-badge>
        <ui-badge tone="primary" outlined>3 updates</ui-badge>
      </div>
    </div>
  </demo-block>
</demo-section>
