name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - id: version
        shell: bash
        run: |
          components_version=$(node -p "require('./packages/components/package.json').version")
          tailwind_version=$(node -p "require('./packages/tailwind/package.json').version")
          compact_version=$(node -p "require('./packages/tailwind-compact/package.json').version")

          if [ "$components_version" != "$tailwind_version" ] || [ "$components_version" != "$compact_version" ]; then
            echo "Package versions differ: components=$components_version tailwind=$tailwind_version compact=$compact_version" >&2
            exit 1
          fi

          echo "version=$components_version" >> "$GITHUB_OUTPUT"

      - run: npm run build -w packages/components

      - run: npm run build -w packages/app

      - run: npm pack --dry-run -w packages/components

      - run: npm pack --dry-run -w packages/tailwind

      - run: npm pack --dry-run -w packages/tailwind-compact

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: node --version && npm --version

      - run: npm install

      - run: npm run build -w packages/components

      - name: Publish packages
        shell: bash
        run: |
          version="${{ needs.build.outputs.version }}"

          if npm view "@aurelia-ui-toolkits/headless@$version" version >/dev/null 2>&1; then
            echo "@aurelia-ui-toolkits/headless@$version already exists; skipping publish."
          else
            npm publish ./packages/components --access public
          fi

          if npm view "@aurelia-ui-toolkits/headless-tailwind@$version" version >/dev/null 2>&1; then
            echo "@aurelia-ui-toolkits/headless-tailwind@$version already exists; skipping publish."
          else
            npm publish ./packages/tailwind --access public
          fi

          if npm view "@aurelia-ui-toolkits/headless-tailwind-compact@$version" version >/dev/null 2>&1; then
            echo "@aurelia-ui-toolkits/headless-tailwind-compact@$version already exists; skipping publish."
          else
            npm publish ./packages/tailwind-compact --access public
          fi

          if npm view "@aurelia-ui-toolkits/headless-tailwind-compact@$version" version >/dev/null 2>&1; then
            echo "@aurelia-ui-toolkits/headless-tailwind-compact@$version already exists; skipping publish."
          else
            npm publish -w packages/tailwind-compact --provenance --access public
          fi

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.build.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; creating release for existing tag."
            gh release create "$tag" --generate-notes
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
